# This CI pipeline supports YMB's OSFI compliance requirements by automatically
# testing every change and recording the results in GitHub Actions.
# It helps Ben Secure maintain an auditable history and prevents failed code
# from progressing toward YMB production systems.

name: YMB Banking App CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: pytest test_main.py -v